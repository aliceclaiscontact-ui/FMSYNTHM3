name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create signing key once
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=FMSynth,O=FMSynth,C=RU"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/debug.keystore
            git commit -m "add signing key"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fm-synth-debug
          path: app/build/outputs/apk/debug/*.apk
